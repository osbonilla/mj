<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Galaxia de Lorenz - Partículas Vivas</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background-color: #000; 
            font-family: sans-serif;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: rgba(255, 255, 255, 0.8);
            pointer-events: none;
            z-index: 10;
        }
        h1 { margin: 0; font-size: 1.2rem; letter-spacing: 2px; text-transform: uppercase; }
        p { font-size: 0.8rem; color: #aaa; }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="ui">
        <h1>Fluido de Lorenz</h1>
        <p>30,000 partículas en tiempo real<br>Click + Arrastrar para rotar</p>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // 1. CONFIGURACIÓN BÁSICA
        const scene = new THREE.Scene();
        // Fondo negro profundo con un toque de niebla para profundidad
        scene.fog = new THREE.FogExp2(0x000000, 0.001);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 80);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // Controles de mouse
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.5;

        // 2. SISTEMA DE PARTÍCULAS
        const particleCount = 30000; // Cantidad de "estrellas"
        const geometry = new THREE.BufferGeometry();
        
        // Arrays para almacenar datos de posición y color
        const positions = new Float32Array(particleCount * 3);
        const colors = new Float32Array(particleCount * 3);
        
        // Array extra para guardar el estado "actual" (x,y,z) de cada partícula fuera del buffer gráfico
        const particlesData = [];

        const colorObj = new THREE.Color();

        // Inicialización aleatoria
        for (let i = 0; i < particleCount; i++) {
            // Empezamos las partículas en un área aleatoria pequeña para que "exploten" hacia el atractor
            const x = (Math.random() - 0.5) * 50;
            const y = (Math.random() - 0.5) * 50;
            const z = (Math.random() - 0.5) * 50;

            positions[i * 3] = x;
            positions[i * 3 + 1] = y;
            positions[i * 3 + 2] = z;

            // Guardamos el estado matemático
            particlesData.push({ x, y, z });

            // Color inicial (blanco/azulado)
            colors[i * 3] = 1;
            colors[i * 3 + 1] = 1;
            colors[i * 3 + 2] = 1;
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        // Material estilo "Galaxia"
        const material = new THREE.PointsMaterial({
            size: 0.3,
            vertexColors: true,
            blending: THREE.AdditiveBlending, // Esto hace que brillen cuando se juntan
            depthWrite: false, // Importante para transparencias
            transparent: true,
            opacity: 0.8
        });

        const particleSystem = new THREE.Points(geometry, material);
        scene.add(particleSystem);

        // 3. FÍSICA Y ANIMACIÓN
        // Constantes de Lorenz
        const sigma = 10;
        const rho = 28;
        const beta = 5/5;
        const dt = 0.0008; // Velocidad del tiempo

        function animate() {
            requestAnimationFrame(animate);

            const positionsAttr = geometry.attributes.position;
            const colorsAttr = geometry.attributes.color;

            // Bucle principal: Actualizar cada partícula individualmente
            for (let i = 0; i < particleCount; i++) {
                const p = particlesData[i];

                // Ecuaciones de Lorenz (Matemática del movimiento)
                const dx = (sigma * (p.y - p.x)) * dt;
                const dy = (p.x * (rho - p.z) - p.y) * dt;
                const dz = (p.x * p.y - beta * p.z) * dt;

                // Actualizar coordenadas
                p.x += dx;
                p.y += dy;
                p.z += dz;

                // Actualizar buffer gráfico
                positionsAttr.setXYZ(i, p.x, p.y, p.z);

                // --- COLOREADO DINÁMICO ---
                // Cambiar color según la velocidad o posición para efecto visual
                // Usamos la coordenada Z para el tono y X para la saturación
                const hue = (p.z / 50) + 0.6; // Tonos azules/morados
                const lightness = 0.5 + Math.abs(p.x / 100); 
                
                colorObj.setHSL(hue, 0.8, lightness);
                
                colorsAttr.setXYZ(i, colorObj.r, colorObj.g, colorObj.b);
            }

            // AVISAR A THREE.JS QUE LOS DATOS CAMBIARON
            positionsAttr.needsUpdate = true;
            colorsAttr.needsUpdate = true;

            controls.update();
            renderer.render(scene, camera);
        }

        // Responsividad
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
